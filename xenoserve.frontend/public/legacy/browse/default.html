<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <!--Make width compatible for handheld screens-->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="media-listing.css">
    <title>XenoServe Browse</title>
</head>
<body>
    <!--Menu-->
    <div class="menu-bar-container">
        <!--Logo-->
        <span>XS</span>

        <!--Menu-->
        <!--Search-Form-->
        <form id="search-form">
            <input type="text" id="search-input" name="searchString" placeholder="Enter search term">
            <button type="submit" id="search-submit">Search</button>
        </form>
    </div>

    <!--Main content area-->
    <div id="container" class="main">
        <!--media-viewer-->
        <div id="media-container" class="main-content-container">
            <!--video source gets updated when a result is clicked-->
            <!--can later change to image or audio viewer based on media type-->
            <div id="viewer-container" class="viewer-container">
                <video id="media-viewer" controls style="display:none;width:100%;"></video>
            </div>

            <div class="flex-h-spread under-viewer-controls">
                <div>
                    <span id="next-media-title">Next up...</span>
                </div>
                <div>
                    <button id="next-media-btn">
                        <span>Next</span>
                    </button>
                </div>
            </div>

            <script type="module">
                import { XenoServeMediaViewer } from './media-viewer.js';
                window.xenoserveMediaViewer = new XenoServeMediaViewer();
                document.addEventListener(
                    'DOMContentLoaded',
                    event => window.xenoserveMediaViewer.initialize());
            </script>
        </div>

        <!--search-results-->
        <div id="results-container" class="side-column-container">
            <div id="pagination-container" class="right-wrap-list">
                <button id="pagination-first" title="First">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18 6L16.59 7.41 12.17 12l4.42 4.59L18 18l-6-6 6-6z" />
                        <path d="M6 6h2v12H6z" />
                    </svg>
                </button>

                <button id="pagination-previous" title="Previous">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
                    </svg>
                </button>

                <div id="pagination-list">
                    <span>0</span>
                </div>

                <button id="pagination-next" title="Next">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z" />
                    </svg>
                </button>

                <button id="pagination-last" title="Last">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 6l6 6-6 6 1.41 1.41L13.83 12 7.41 5.59z" />
                        <path d="M16 6h2v12h-2z" />
                    </svg>
                </button>
            </div>
            <!--results to be dynamically populated in the containment below-->
            <div id="results-list" class="results-list"> </div>
        </div>
    </div>

    <!--on-page-loaded-->
    <script type="module">
        import { XenoServeMediaListing } from "./media-listing.js";

        function initializeXenoserve() {
            const xs = new XenoServeMediaListing();
            // until the page is split, we can use this to bridge intents
            xs.playbackHandler = window.xenoserveMediaViewer.playMediaAsync.bind(window.xenoserveMediaViewer);
            window.xenoserveMediaListing = xs;
            xs.initialize();
        }

        document.addEventListener("DOMContentLoaded", initializeXenoserve);
    </script>
</body>
</html>

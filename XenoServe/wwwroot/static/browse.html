<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>XenoServe Browse</title>
</head>
<body>
    <h1>Welcome to XenoServe</h1>

    <!--media-viewer-->
    <div id="media-container">
        <!--video source gets updated when a result is clicked-->
        <!--can later change to image or audio viewer based on media type-->
        <video id="media-viewer" controls style="display:none;width:100%;"></video>
    </div>

    <!--search and pagination-->
    <div class="search-container">
        <!--sends an async api request when a user pauses typing for 500ms-->
        <form id="search-form">
            <input type="text" id="search-input" name="searchString" placeholder="Enter search term">
            <button type="submit" id="search-submit">Search</button>
        </form>

        <!--pagination kept in the same row since the query would share the same data-->
        <div id="pagination-container">
            <button disabled>&laquo; Prev</button>
            <span>Page 0</span>
            <button>Next &raquo;</button>
        </div>
    </div>

    <!--search-results-->
    <div id="results-container">
        <!--results to be dynamically populated in the containment below-->
        <div id="results-list"> </div>
    </div>

    <!--on-page-loaded-->
    <script type="module">
        import { XenoServeMediaListing } from "/js/media-listing/media-listing.js";

        function initializeXenoserve() {
            window.xenoserveMediaListing = new XenoServeMediaListing();
            window.xenoserveMediaListing.initialize();
        }

        document.addEventListener("DOMContentLoaded", initializeXenoserve);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en-gb">
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/stylesheets/local-pairing.css" />
    <title>XenoServe :: IP-PIN Login</title>
</head>
<body>
    <div id="content-container">

        <!--Menu-bar-->
        <div id="menu-bar-container" class="menu-bar-container">
            <div id="menu-bar">
                <!--Logo-->
                <span>XS</span>

                <!--Menu-->
            </div>
        </div>

        <!--Control panel-->
        <div class="control-panel-container">
            <div class="control-panel">

                <!--Section: Status-->
                <section class="cp-section">
                    <div class="cp-section-header flex-h-spread flex-v-center">
                        <span>Status</span>
                    </div>
                    <div class="cp-section-content flex-column">
                        <div>
                            <span id="cptext-system-message">255.255.255.255</span>
                        </div>
                        <div>
                            <span>IP:</span>
                            <span id="cp-current-ip-text">255.255.255.255</span>
                        </div>
                        <div>
                            <span id="cp-login-state-text">Checking...</span>
                        </div>
                        <div class="flex-v-center flex-right">
                            <button class="flex-right" id="cpbtn-logout">Log off</button>
                        </div>
                    </div>
                </section>

                <!--Section: Pin-->
                <section class="cp-section">
                    <div class="cp-section-header">
                        <span>Pin</span>
                    </div>
                    <div class="cp-section-content">
                        <form id="cpform-ip-pin-form">
                            <div class="flex-column">
                                <input type="text" id="cpform-auth-pin-field" name="pin" class="full-width"
                                       inputmode="numeric" maxlength="6" pattern="\d{6}" autocomplete="off"
                                       placeholder="Enter the 6 digit pin" />
                                <div class="flex-h-spread flex-v-center">
                                    <button id="cpbtn-generate-pin">Generate</button>
                                    <button type="submit">Submit</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </section>

                <!--Section: IP-->
                <div class="cp-section" id="cpsection-active-ip">
                    <div class="cp-section-header flex-h-spread flex-v-center">
                        <span>Active IP</span>
                        <span id="cptext-active-ip">255.255.255.255</span>
                    </div>
                    <div class="cp-section-content flex-column">
                        <div>
                            <span id="cptext-ip-lease">Checking...</span>
                        </div>
                        <div class="flex-h-spread">
                            <!--auto-populate based on status-->
                            <button id="cpbtn-activate-ip">
                                <span id="cptext-activate-ip-btn">
                                    Activate
                                </span>
                            </button>
                            <!--expanding-spacer-implementation-->
                            <button id="cpbtn-deactivate-ip">Deactivate</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { XsIpPinAuthClient } from "/js/auth/local-pairing.js";

        function initializeIpPinAuthClient() {
            window.ipPinAuthClient = new XsIpPinAuthClient();
            window.ipPinAuthClient.initialize();
        }

        document.addEventListener("DOMContentLoaded", initializeIpPinAuthClient);
    </script>
</body>
</html>
